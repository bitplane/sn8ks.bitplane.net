    <script>
      const poster = document.querySelector("#poster");
      const startButton = document.querySelector("#start");
      let armed = false;
      let started = false;
      let bindingPoll;

      function arm() {
        if (started || typeof window.wasmBindings?.start !== "function") return;
        armed = true;
        poster.classList.add("ready");
        startButton.disabled = false;
        startButton.textContent = "click to start";
        const version = window.wasmBindings.version?.();
        if (version) document.querySelector("#version").textContent = `v${version}`;
        clearInterval(bindingPoll);
      }

      function start(event) {
        if (!armed || started) return;
        if (event.type === "click" && event.target.closest("a")) return;
        if (event.type === "keydown" && event.repeat) return;
        started = true;
        armed = false;
        startButton.disabled = true;
        poster.removeEventListener("click", start);
        window.removeEventListener("keydown", start);

        const startedAt = performance.now();
        const focusCanvas = new MutationObserver(() => {
          const canvas = document.querySelector("canvas");
          if (canvas) {
            canvas.focus();
            focusCanvas.disconnect();
          }
        });
        focusCanvas.observe(document.body, { childList: true });
        const BrowserAudioContext = window.AudioContext || window.webkitAudioContext;
        if (BrowserAudioContext) {
          try {
            const activationContext = new BrowserAudioContext();
            activationContext.resume().then(() => activationContext.close());
          } catch (error) {
            console.warn("sn8ks audio activation anchor failed", error);
          }
        }
        window.wasmBindings.start();
        poster.remove();
        const canvas = document.querySelector("canvas");
        if (canvas) {
          canvas.focus();
          focusCanvas.disconnect();
        }
        console.log(`sn8ks click → start() returned: ${(performance.now() - startedAt).toFixed(1)}ms`);
      }

      window.addEventListener("TrunkApplicationStarted", arm, { once: true });
      poster.addEventListener("click", start);
      window.addEventListener("keydown", start);
      bindingPoll = setInterval(arm, 50);
      arm();
    </script>
